  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-presets="react">
// SerialHop panel — shell + shared primitives
/* global React */

const { useState } = React;

const TABS = [
  { id: "status",  label: "Status"  },
  { id: "config",  label: "Config"  },
  { id: "devices", label: "Devices" },
  { id: "ports",   label: "Ports"   },
  { id: "logs",    label: "Logs"    },
];

function Help({ id, openHelpId, title, what, deflt, when }) {
  const open = openHelpId === id;
  return (
    <span style={{ position: "relative", display: "inline-flex" }}>
      <span className="shp-help" data-open={open}>?</span>
      {open && (
        <div className="shp-popover">
          <h5>{title}</h5>
          <p>{what}</p>
          {deflt && (
            <dl>
              <dt>Default</dt><dd>{deflt}</dd>
            </dl>
          )}
          {when && <p style={{ marginTop: 6 }}>{when}</p>}
        </div>
      )}
    </span>
  );
}

function Footer({ kind = "info", text, time, progress }) {
  const kindLabel = {
    ok:   "OK",
    work: "···",
    err:  "ERR",
    info: "·",
  }[kind] || "·";
  return (
    <div className="shp-footer">
      <span className="shp-footer__icon" data-kind={kind}>{kindLabel}</span>
      <span className="shp-footer__text" dangerouslySetInnerHTML={{ __html: text }} />
      {typeof progress === "number" && (
        <span className="shp-footer__progress"><i style={{ width: `${progress}%` }} /></span>
      )}
      {time && <span className="shp-footer__time">{time}</span>}
    </div>
  );
}

function TitleBar({ version }) {
  return (
    <div className="shp-titlebar">
      <div className="shp-titlebar__title">
        <b>SerialHop</b> <span className="shp-titlebar__chip">v{version}</span>
      </div>
      <div className="shp-titlebar__buttons">
        <span className="shp-titlebar__btn">—</span>
        <span className="shp-titlebar__btn">▢</span>
        <span className="shp-titlebar__btn">✕</span>
      </div>
    </div>
  );
}

function TabBar({ tabs, active, dirty }) {
  return (
    <div className="shp-tabs">
      {tabs.map(t => (
        <button key={t.id} className="shp-tab" data-active={active === t.id}>
          {t.label}
          {t.id === "config" && dirty && <span className="shp-tab__dirty" />}
        </button>
      ))}
    </div>
  );
}

function Warning({ message, tone = "warn" }) {
  if (!message) return null;
  return (
    <div className="shp-warning" data-tone={tone}>
      <span className="shp-warning__icon">⚠</span>
      <span>{message}</span>
    </div>
  );
}

function Lamp({ name, tone, label, sub, pulse, helpId, openHelpId, helpProps }) {
  return (
    <div className="shp-lamp">
      <div className="shp-lamp__row">
        <span className="shp-lamp__name">{name}</span>
        <Help id={helpId} openHelpId={openHelpId} {...helpProps} />
      </div>
      <div className="shp-lamp__state">
        <span className="shp-lamp__dot" data-tone={tone} data-pulse={pulse}></span>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <span className="shp-lamp__label">{label}</span>
          {sub && <span className="shp-lamp__sub">{sub}</span>}
        </div>
      </div>
    </div>
  );
}

function Button({ variant = "default", elevated, disabled, children, small }) {
  const cls = [
    "shp-btn",
    variant === "primary" && "shp-btn--primary",
    variant === "danger"  && "shp-btn--danger",
    variant === "ghost"   && "shp-btn--ghost",
    small && "shp-btn--sm",
  ].filter(Boolean).join(" ");
  return (
    <button className={cls} disabled={disabled}>
      {elevated && <span className="shp-btn__shield">UAC</span>}
      {children}
    </button>
  );
}

function Checkbox({ checked, label, disabled }) {
  return (
    <span className="shp-checkbox" data-checked={checked} style={{ opacity: disabled ? 0.55 : 1 }}>
      <span className="shp-checkbox__box">{checked ? "✓" : ""}</span>
      <span>{label}</span>
    </span>
  );
}

function Field({ label, hint, helpId, openHelpId, helpProps, disabled, children }) {
  return (
    <div className="shp-field">
      <label className="shp-field__label" data-disabled={disabled}>
        <span>{label}</span>
        {helpProps && <Help id={helpId} openHelpId={openHelpId} {...helpProps} />}
      </label>
      <div className="shp-field__col">
        {children}
        {hint && <div className="shp-field__hint">{hint}</div>}
      </div>
    </div>
  );
}

function Section({ title, helpProps, helpId, openHelpId, children }) {
  return (
    <section className="shp-form-section">
      <div className="shp-form-section__head">
        {title}
        {helpProps && <Help id={helpId} openHelpId={openHelpId} {...helpProps} />}
      </div>
      <div className="shp-form-section__body">{children}</div>
    </section>
  );
}

function Modal({ title, sub, children, actions }) {
  return (
    <div className="shp-modal-scrim">
      <div className="shp-modal">
        <div className="shp-modal__head">
          <h3 className="shp-modal__title">{title}</h3>
          {sub && <div className="shp-modal__sub">{sub}</div>}
        </div>
        <div className="shp-modal__body">{children}</div>
        <div className="shp-modal__foot">{actions}</div>
      </div>
    </div>
  );
}

// Window shell that wraps any tab body
function PanelWindow({ version, warning, activeTab, dirty, footer, children, modal }) {
  return (
    <div className="shp-window">
      <TitleBar version={version} />
      <TabBar tabs={TABS} active={activeTab} dirty={dirty} />
      <Warning message={warning} />
      <div className="shp-content">
        <div className="shp-content__pad">{children}</div>
      </div>
      <Footer {...footer} />
      {modal}
    </div>
  );
}

Object.assign(window, {
  PanelWindow, Footer, TitleBar, TabBar, Warning, Lamp,
  Button, Checkbox, Field, Section, Help, Modal,
});

</script>

<script type="text/babel" data-presets="react">
// SerialHop — Status tab content
/* global React, Lamp, Button, Help */

function StatusTab({ lamps, serviceState, update, openHelpId, footerNote }) {
  // serviceState: 'installed' | 'not-installed' | 'transitioning'
  const installed = serviceState === "installed";
  const notInstalled = serviceState === "not-installed";
  const transitioning = serviceState === "transitioning";

  return (
    <div>
      <div className="shp-h">Service health</div>
      <div className="shp-lamps">
        <Lamp
          name="Local service"
          tone={lamps.service.tone}
          label={lamps.service.label}
          sub={lamps.service.sub}
          pulse={lamps.service.pulse}
          helpId="lamp-service"
          openHelpId={openHelpId}
          helpProps={{
            title: "Local service",
            what: "Is the SerialHop background service installed and running on this machine.",
            deflt: "Green = running",
            when:
              "Red means not installed and the configuration is invalid, so the service can't start. Grey means installed but stopped, or in the middle of starting or stopping.",
          }}
        />
        <Lamp
          name="Lab-bridge server"
          tone={lamps.server.tone}
          label={lamps.server.label}
          sub={lamps.server.sub}
          pulse={lamps.server.pulse}
          helpId="lamp-server"
          openHelpId={openHelpId}
          helpProps={{
            title: "Lab-bridge server",
            what: "Whether the remote lab-bridge server is reachable and its tunnel daemon (chisel) is healthy.",
            when: "Red means the server is reachable but its tunnel daemon isn't responding. Grey means the server can't be reached at all.",
          }}
        />
        <Lamp
          name="Reverse tunnel"
          tone={lamps.tunnel.tone}
          label={lamps.tunnel.label}
          sub={lamps.tunnel.sub}
          pulse={lamps.tunnel.pulse}
          helpId="lamp-tunnel"
          openHelpId={openHelpId}
          helpProps={{
            title: "Reverse tunnel",
            what: "This machine's reverse tunnel into the lab-bridge.",
            when: "Red = disconnect or auth failure. Yellow = transient server-side error. Grey = checking, not configured, or server unreachable.",
          }}
        />
      </div>

      <div className="shp-h">Service control</div>
      <div className="shp-service-actions">
        <Button variant="primary" elevated disabled={installed || transitioning}>Install</Button>
        <Button variant="danger" elevated disabled={!installed || transitioning}>Uninstall</Button>
        <Button elevated disabled={!installed || transitioning}>Restart</Button>
        <span className="shp-service-actions__hint">
          {notInstalled  && "↑ Install requires admin privileges"}
          {installed     && "↑ All service actions require admin privileges"}
          {transitioning && "Working — re-checking lamps…"}
        </span>
      </div>

      {footerNote && (
        <div style={{ marginTop: 14, fontSize: 11.5, color: "var(--text-muted)", fontFamily: "'IBM Plex Mono', monospace" }}>
          {footerNote}
        </div>
      )}

      {update && <UpdateRow {...update} />}
    </div>
  );
}

function UpdateRow({ stage, version, downloaded, total, percent }) {
  if (stage === "available") {
    return (
      <div className="shp-update" data-tone="blue">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg">
          Version <b>v{version}</b> is available.
        </span>
        <div className="shp-update__actions">
          <Button>Release notes</Button>
          <Button variant="primary">Download</Button>
        </div>
      </div>
    );
  }
  if (stage === "downloading") {
    return (
      <div className="shp-update" data-tone="blue">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg" style={{ flex: "0 0 auto" }}>
          <b>v{version}</b> downloading…
        </span>
        <div className="shp-update__progressbar"><i style={{ width: `${percent}%` }} /></div>
        <span className="shp-update__stats">{downloaded} / {total} · {percent}%</span>
        <div className="shp-update__actions">
          <Button variant="danger">Cancel</Button>
        </div>
      </div>
    );
  }
  if (stage === "download-failed") {
    return (
      <div className="shp-update" data-tone="red">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg">
          <b>v{version}</b> — download failed.
        </span>
        <div className="shp-update__actions">
          <Button>Retry</Button>
        </div>
      </div>
    );
  }
  if (stage === "ready") {
    return (
      <div className="shp-update" data-tone="blue">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg">
          <b>v{version}</b> ready to install.
        </span>
        <div className="shp-update__actions">
          <Button>Release notes</Button>
          <Button variant="primary" elevated>Install update</Button>
        </div>
      </div>
    );
  }
  if (stage === "installing") {
    return (
      <div className="shp-update" data-tone="blue">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg">Installing… service will restart automatically.</span>
        <div className="shp-update__progressbar"><i style={{ width: "62%" }} /></div>
      </div>
    );
  }
  if (stage === "installed") {
    return (
      <div className="shp-update" data-tone="green">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg">
          Updated to <b>v{version}</b>. Close and reopen this window to load the new panel.
        </span>
      </div>
    );
  }
  if (stage === "install-failed") {
    return (
      <div className="shp-update" data-tone="red">
        <span className="shp-update__tag">Update</span>
        <span className="shp-update__msg">
          Update failed — service restored to previous version.
        </span>
        <div className="shp-update__actions">
          <Button>Retry</Button>
        </div>
      </div>
    );
  }
  return null;
}

Object.assign(window, { StatusTab, UpdateRow });

</script>

<script type="text/babel" data-presets="react">
// SerialHop — Config tab content
/* global React, Section, Field, Button, Checkbox, Help */

function ConfigTab({
  values,
  errors = {},
  dirty,
  showFirstLaunch,
  credentialError,
  openHelpId,
}) {
  const v = values;
  const showCredErr = !!credentialError;
  const flashDisabled = !v.flash_enabled;

  return (
    <div>
      {showFirstLaunch && (
        <div className="shp-banner">
          <span className="shp-banner__chip">First launch</span>
          <span>Enter your lab-bridge credentials to enable the service.</span>
        </div>
      )}

      <Section title="Lab-bridge"
        helpId="sec-bridge" openHelpId={openHelpId}
        helpProps={{
          title: "Lab-bridge",
          what: "The remote server this machine tunnels into so the rest of the lab network can reach the devices on this host.",
        }}
      >
        <Field label="Host"
          helpId="cfg-host" openHelpId={openHelpId}
          helpProps={{
            title: "Lab-bridge host",
            what: "The address of the lab-bridge server.",
            deflt: "111.88.145.138",
            when: "Change only if your lab uses a different bridge installation.",
          }}>
          <input className="shp-input shp-input--mono" defaultValue={v.host} data-error={!!errors.host} />
          {errors.host && <div className="shp-error">{errors.host}</div>}
        </Field>

        <Field label="Username"
          helpId="cfg-user" openHelpId={openHelpId}
          helpProps={{
            title: "Lab-bridge username",
            what: "The credential issued to this machine for connecting to the lab-bridge.",
            when: "Verified against the server when saved. Required.",
          }}>
          <input className="shp-input" defaultValue={v.username}
            data-error={!!errors.username || showCredErr}
            placeholder={!v.username ? "e.g. bench-04" : undefined} />
          {errors.username && <div className="shp-error">{errors.username}</div>}
        </Field>

        <Field label="Password"
          helpId="cfg-pw" openHelpId={openHelpId}
          helpProps={{
            title: "Lab-bridge password",
            what: "Shown in plain text by design — operators sometimes need to read it back over the phone to the lab admin.",
            when: "Verified against the server when saved.",
          }}>
          <input className="shp-input shp-input--mono" defaultValue={v.password}
            data-error={!!errors.password || showCredErr}
            placeholder={!v.password ? "(plain text — not hidden)" : undefined} />
          {errors.password && <div className="shp-error">{errors.password}</div>}
          {showCredErr && (
            <div className="shp-error">Server rejected these credentials. Check the username and password.</div>
          )}
        </Field>
      </Section>

      <Section title="REST"
        helpProps={{ title: "REST", what: "The local HTTP server other lab tools on this machine talk to." }}
        helpId="sec-rest" openHelpId={openHelpId}>
        <Field label="Port"
          helpId="cfg-port" openHelpId={openHelpId}
          helpProps={{
            title: "REST port",
            what: "Local port for the HTTP API.",
            deflt: "0",
            when: "Use 0 to let the OS pick a free port. Set a specific port only if another tool needs to find SerialHop at a known address.",
          }}>
          <input className="shp-input shp-input--mono" style={{ width: 120 }}
            defaultValue={v.rest_port} />
          <div className="shp-field__hint">0 = OS picks a free port</div>
        </Field>
      </Section>

      <Section title="Discovery"
        helpProps={{ title: "Discovery", what: "How the service searches the local serial ports for known device types." }}
        helpId="sec-disc" openHelpId={openHelpId}>
        <Field label="Include list"
          helpId="cfg-incl" openHelpId={openHelpId}
          helpProps={{
            title: "Include list",
            what: "If non-empty, only these ports are probed.",
            when: "Use when other software owns specific COM ports. Leave empty to probe everything.",
          }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {(v.include.length ? v.include : [""]).map((p, i) => (
              <div className="shp-listrow" key={i}>
                <input className="shp-input shp-input--mono" defaultValue={p} placeholder="COM3" style={{ maxWidth: 200 }} />
                <Button small variant="ghost">Remove</Button>
              </div>
            ))}
            <Button small variant="ghost" style={{ alignSelf: "flex-start" }}>+ Add row</Button>
          </div>
        </Field>

        <Field label="Exclude list" disabled={v.include.length > 0}
          helpId="cfg-excl" openHelpId={openHelpId}
          helpProps={{
            title: "Exclude list",
            what: "Ports listed here are skipped during probing.",
            when: "Mutually exclusive with Include.",
          }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {(v.exclude.length ? v.exclude : [""]).map((p, i) => (
              <div className="shp-listrow" key={i}>
                <input className="shp-input shp-input--mono" defaultValue={p}
                  disabled={v.include.length > 0} placeholder="COM7" style={{ maxWidth: 200 }} />
                <Button small variant="ghost" disabled={v.include.length > 0}>Remove</Button>
              </div>
            ))}
            <Button small variant="ghost" style={{ alignSelf: "flex-start" }} disabled={v.include.length > 0}>+ Add row</Button>
            {v.include.length > 0 && (
              <div className="shp-disabled-note">Include and Exclude can't be used together.</div>
            )}
          </div>
        </Field>

        <Field label="Post-open settle"
          helpId="cfg-settle" openHelpId={openHelpId}
          helpProps={{
            title: "Post-open settle (ms)",
            what: "How long to wait after opening a serial port before sending the discovery probe.",
            deflt: "2000 ms",
            when: "Lower if your devices don't reset when the port is opened; raise if discovery is silently missing devices.",
          }}>
          <div className="shp-input-row" style={{ maxWidth: 220 }}>
            <input className="shp-input shp-input--mono" defaultValue={v.settle_ms} />
            <span className="shp-muted">ms</span>
          </div>
        </Field>
      </Section>

      <Section title="Logging"
        helpProps={{ title: "Logging", what: "Verbosity of the service's structured log." }}
        helpId="sec-log" openHelpId={openHelpId}>
        <Field label="Level"
          helpId="cfg-loglvl" openHelpId={openHelpId}
          helpProps={{
            title: "Log level",
            what: "Records at this severity and higher are written to disk.",
            deflt: "info",
            when: "Use debug only while reproducing a problem — debug logs are large.",
          }}>
          <select className="shp-select" style={{ width: 160 }} defaultValue={v.log_level}>
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </Field>
      </Section>

      <Section title="Auto-update"
        helpProps={{ title: "Auto-update", what: "Whether the panel checks for and downloads new SerialHop releases on its own." }}
        helpId="sec-upd" openHelpId={openHelpId}>
        <Field label="Enabled"
          helpId="cfg-upd" openHelpId={openHelpId}
          helpProps={{
            title: "Auto-update",
            what: "On by default. The panel checks once at launch and once per day while open.",
            when: "The actual install still requires an explicit click on the Status tab.",
          }}>
          <Checkbox checked={v.autoupdate} label="Check for updates automatically" />
        </Field>
      </Section>

      <Section title="Raw serial"
        helpProps={{ title: "Raw serial", what: "Exposes a passthrough endpoint that lets clients send/receive arbitrary bytes on any discovered port." }}
        helpId="sec-raw" openHelpId={openHelpId}>
        <Field label="Enabled"
          helpId="cfg-raw" openHelpId={openHelpId}
          helpProps={{
            title: "Raw serial",
            what: "Off by default. Turn on if a client needs byte-level access to a device.",
            when: "Doesn't bypass the firmware-flashing safety — leave that off.",
          }}>
          <Checkbox checked={v.raw_enabled} label="Allow raw passthrough on discovered ports" />
        </Field>
      </Section>

      <Section title="Firmware flashing"
        helpProps={{ title: "Firmware flashing", what: "Higher-risk passthrough that lets clients write firmware to a connected board." }}
        helpId="sec-flash" openHelpId={openHelpId}>
        <div className="shp-info-block">
          <span className="shp-info-block__icon">⚠</span>
          <span>
            Firmware flashing is <b>higher risk</b> than raw serial — a bad firmware file can brick the board,
            requiring physical recovery. Leave disabled unless you're actively flashing devices.
          </span>
        </div>

        <Field label="Enabled"
          helpId="cfg-flash-on" openHelpId={openHelpId}
          helpProps={{
            title: "Firmware flashing enabled",
            what: "Off by default. Turn on only while you're actively flashing.",
            when: "Backups are written to the directory below.",
          }}>
          <Checkbox checked={v.flash_enabled} label="Allow firmware flashing through the service" />
        </Field>

        <Field label="Backup directory" disabled={flashDisabled}
          helpId="cfg-flash-dir" openHelpId={openHelpId}
          helpProps={{
            title: "Firmware backup directory",
            what: "Existing firmware is read off the board and saved here before a new image is flashed.",
            deflt: "%LOCALAPPDATA%/SerialHop/backups",
            when: "Must be an absolute path. Leave empty to use the default.",
          }}>
          <div className="shp-input-row">
            <input className="shp-input shp-input--mono" defaultValue={v.flash_dir}
              disabled={flashDisabled}
              data-error={!!errors.flash_dir} />
            <Button small disabled={flashDisabled}>Choose…</Button>
          </div>
          {errors.flash_dir && <div className="shp-error">{errors.flash_dir}</div>}
        </Field>

        <Field label="Keep N backups" disabled={flashDisabled}
          helpId="cfg-flash-keep" openHelpId={openHelpId}
          helpProps={{
            title: "Keep N backups",
            what: "How many historical backups to retain per device.",
            deflt: "10",
            when: "0 keeps everything forever.",
          }}>
          <input className="shp-input shp-input--mono" defaultValue={v.flash_keep}
            disabled={flashDisabled} style={{ width: 100 }} />
        </Field>
      </Section>

      <div className="shp-btn-row" style={{ marginTop: 14, paddingTop: 4, borderTop: "1px solid var(--border)" }}>
        <Button variant="primary" disabled={!dirty || Object.keys(errors).length > 0}>Save</Button>
        <Button variant="primary" elevated disabled={!dirty || Object.keys(errors).length > 0}>Save & restart</Button>
        <Button disabled={!dirty}>Discard changes</Button>
        <span className="shp-gap" />
        <Button variant="ghost">Open in editor ↗</Button>
      </div>
    </div>
  );
}

Object.assign(window, { ConfigTab });

</script>

<script type="text/babel" data-presets="react">
// SerialHop — Devices, Ports, Logs tabs
/* global React, Button, Help */

function Toolbar({ banner, banner_html, actions }) {
  return (
    <div className="shp-toolbar">
      <div className="shp-toolbar__banner">
        {banner_html ? <span dangerouslySetInnerHTML={{ __html: banner_html }} /> : banner}
      </div>
      <div className="shp-btn-row">{actions}</div>
    </div>
  );
}

function DevicesTab({ state, devices, lastDiscovered, openHelpId }) {
  // state: 'ok' | 'service-down' | 'never-discovered' | 'unreachable' | 'discovering'
  const isOk = state === "ok";
  const isDiscovering = state === "discovering";
  const allDisabled = state === "service-down" || state === "unreachable";

  let banner_html = "";
  if (state === "service-down") banner_html = `Service is not running. Start it from the <b>Status</b> tab.`;
  else if (state === "never-discovered") banner_html = `No devices yet. Click <b>Rediscover</b> to probe serial ports.`;
  else if (state === "unreachable") banner_html = `Can't reach the local service. It may have just started — wait a few seconds and click <b>Refresh</b>.`;
  else if (state === "discovering") banner_html = `<b>Probing serial ports…</b> closing existing connections.`;
  else banner_html = `<code>Discovered at ${lastDiscovered}</code> · <b>${devices.length}</b> devices`;

  return (
    <div>
      <Toolbar
        banner_html={banner_html}
        actions={
          <>
            <Button variant="primary" disabled={allDisabled || isDiscovering}>↻ Rediscover</Button>
            <Button variant="danger" disabled={!isOk || isDiscovering || devices.length === 0}>Disconnect all</Button>
            <Button disabled={state === "service-down" || isDiscovering}>Refresh</Button>
          </>
        }
      />

      {isOk || isDiscovering ? (
        <div className="shp-table-wrap" style={{ opacity: isDiscovering ? 0.5 : 1, transition: "opacity .2s" }}>
          <table className="shp-table">
            <thead>
              <tr>
                <th style={{ width: "30%" }}>ID</th>
                <th style={{ width: "30%" }}>Type</th>
                <th style={{ width: "30%" }}>Port</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {devices.map(d => (
                <tr key={d.id}>
                  <td><b style={{ color: "var(--text)" }}>{d.id}</b></td>
                  <td>{d.type}</td>
                  <td>{d.port}</td>
                  <td></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <DevicesEmpty state={state} />
      )}
    </div>
  );
}

function DevicesEmpty({ state }) {
  const messages = {
    "service-down": {
      icon: "○ ○ ○",
      title: "Service is not running.",
      body: "Start the SerialHop service from the Status tab. Devices will appear here once it's running and discovery has completed.",
    },
    "never-discovered": {
      icon: "—",
      title: "No devices have been discovered yet.",
      body: "Click Rediscover to probe the available serial ports. This may take several seconds; existing connections will be closed.",
    },
    "unreachable": {
      icon: "?",
      title: "Can't reach the local service.",
      body: "It may have just started. Wait a few seconds and click Refresh. If the problem persists, check the service from the Status tab.",
    },
  };
  const m = messages[state] || messages["service-down"];
  return (
    <div className="shp-empty">
      <div className="shp-empty__icon">{m.icon}</div>
      <div className="shp-empty__title">{m.title}</div>
      <div className="shp-empty__body">{m.body}</div>
    </div>
  );
}

function PortsTab({ ports, openHelpId }) {
  const matched = ports.filter(p => p.discovered).length;
  return (
    <div>
      <Toolbar
        banner_html={`<b>${ports.length}</b> ports enumerated by the OS · <b>${matched}</b> matched to a device`}
        actions={
          <>
            <Button>↻ Refresh</Button>
            <Button variant="primary">Rediscover</Button>
          </>
        }
      />
      <div className="shp-table-wrap">
        <table className="shp-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>USB</th>
              <th>
                VID
                <Help id="hdr-vid" openHelpId={openHelpId} helpProps={{
                  title: "Vendor ID (VID)",
                  what: "USB vendor ID assigned by USB-IF, shown in hex.",
                  when: "Useful when matching against driver INF files or vendor docs.",
                }} />
              </th>
              <th>
                PID
                <Help id="hdr-pid" openHelpId={openHelpId} helpProps={{
                  title: "Product ID (PID)",
                  what: "Per-vendor product identifier, in hex.",
                  when: "Together with VID, uniquely identifies the device model.",
                }} />
              </th>
              <th>
                Serial №
                <Help id="hdr-sn" openHelpId={openHelpId} helpProps={{
                  title: "Serial number",
                  what: "Per-unit serial string the device reports over USB.",
                  when: "Not every device reports one — blank is normal.",
                }} />
              </th>
              <th>
                Product
                <Help id="hdr-prod" openHelpId={openHelpId} helpProps={{
                  title: "Product descriptor",
                  what: "Human-readable product string the device advertises.",
                }} />
              </th>
              <th>
                Discovered
                <Help id="hdr-disc" openHelpId={openHelpId} helpProps={{
                  title: "Discovered",
                  what: "A check means SerialHop matched a logical device on this port.",
                  when: "Blank means the OS sees the port but discovery didn't recognise anything on it.",
                }} />
              </th>
              <th>
                Device ID
                <Help id="hdr-did" openHelpId={openHelpId} helpProps={{
                  title: "Device ID",
                  what: "The logical ID the matched device is addressed by.",
                  when: "Empty when nothing was matched on this port.",
                }} />
              </th>
            </tr>
          </thead>
          <tbody>
            {ports.map(p => (
              <tr key={p.name} data-selected={p.selected}>
                <td><b style={{ color: "var(--text)" }}>{p.name}</b></td>
                <td>{p.usb ? <span className="shp-check">✓</span> : <span className="shp-dim">—</span>}</td>
                <td>{p.vid || <span className="shp-dim">—</span>}</td>
                <td>{p.pid || <span className="shp-dim">—</span>}</td>
                <td>{p.serial || <span className="shp-dim">—</span>}</td>
                <td style={{ whiteSpace: "normal", fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
                  {p.product || <span className="shp-dim">—</span>}
                </td>
                <td>{p.discovered ? <span className="shp-check">✓</span> : <span className="shp-dim">—</span>}</td>
                <td>{p.deviceId || <span className="shp-dim">—</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LogsTab({ stream, levelFilter, follow, search, lines, selectedIdx, openHelpId, mode = "table" }) {
  const isService = stream === "service";
  return (
    <div>
      <div className="shp-logs-controls">
        <label className="shp-row" style={{ gap: 6 }}>
          <span className="shp-muted" style={{ fontSize: 11.5, fontWeight: 500 }}>Stream</span>
          <Help id="logs-stream" openHelpId={openHelpId} helpProps={{
            title: stream === "service" ? "Service log" : stream === "stderr" ? "Stderr" : "Panel errors",
            what:
              stream === "service" ? "Structured log records the service writes to disk."
              : stream === "stderr" ? "Raw stderr output from the service — panic traces and lower-level errors."
              : "Errors the panel itself logged. Useful when the panel UI misbehaves.",
            when: stream === "service" ? "Filter by level using the Level dropdown." : "No level metadata, so the Level filter is ignored.",
          }} />
          <select className="shp-select" defaultValue={stream} style={{ width: 160 }}>
            <option value="service">Service log</option>
            <option value="stderr">Stderr</option>
            <option value="panel">Panel errors</option>
          </select>
        </label>

        <label className="shp-row" style={{ gap: 6 }}>
          <span className="shp-muted" style={{ fontSize: 11.5, fontWeight: 500 }}>Level</span>
          <select className="shp-select" defaultValue={levelFilter} disabled={!isService} style={{ width: 110 }}>
            <option value="all">all</option>
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>

        <div className="shp-toggle" data-on={follow}>
          <span className="shp-toggle__sw"></span>
          <span>Follow</span>
        </div>

        <input className="shp-input shp-input--mono" placeholder="Search…" defaultValue={search}
          style={{ width: 220 }} />

        <span className="shp-gap" />

        <Button variant="ghost">Open logs folder ↗</Button>
      </div>

      {isService && mode === "table" ? (
        <div className="shp-table-wrap" style={{ maxHeight: 420, overflow: "auto" }}>
          <table className="shp-table shp-logs-table">
            <thead>
              <tr>
                <th className="col-time">Time</th>
                <th className="col-level">Level</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody>
              {lines.map((l, i) => (
                <React.Fragment key={i}>
                  <tr data-selected={i === selectedIdx}>
                    <td className="col-time">{l.time}</td>
                    <td><span className="shp-level-pill" data-level={l.level}>{l.level}</span></td>
                    <td style={{ whiteSpace: "pre" }}>
                      {highlightSearch(l.msg, search)}
                    </td>
                  </tr>
                  {i === selectedIdx && l.fields && (
                    <tr className="shp-logs-detail">
                      <td colSpan={3}>
                        <dl className="shp-kv">
                          {Object.entries(l.fields).map(([k, v]) => (
                            <React.Fragment key={k}>
                              <dt>{k}</dt><dd>{v}</dd>
                            </React.Fragment>
                          ))}
                        </dl>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <pre className="shp-mono-view">
          {lines.map((l, i) => (
            <span key={i}>
              <span className="ln-time">{l.time} </span>
              <span className={l.kind ? `ln-${l.kind}` : ""}>{l.text}</span>
              {"\n"}
            </span>
          ))}
        </pre>
      )}
    </div>
  );
}

function highlightSearch(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i === -1) return text;
  return (
    <>
      {text.slice(0, i)}
      <mark style={{ background: "var(--warning-soft)", color: "var(--text)", padding: "0 2px", borderRadius: 2 }}>
        {text.slice(i, i + q.length)}
      </mark>
      {text.slice(i + q.length)}
    </>
  );
}

Object.assign(window, { DevicesTab, PortsTab, LogsTab });

</script>

<script type="text/babel" data-presets="react">

   PanelWindow, StatusTab, ConfigTab, DevicesTab, PortsTab, LogsTab,

function App() {
  const [t, setTweak] = useTweaks(DEFAULT_TWEAKS);

  React.useEffect(() => {
    document.documentElement.dataset.theme = t.theme;
    document.documentElement.style.setProperty("--accent", t.accent);
    document.documentElement.style.setProperty("--accent-hover", shade(t.accent, -14));
  }, [t.theme, t.accent]);

  return (
    <>
      <DesignCanvas>
        {SECTIONS.map(s => (
          <DCSection id={s.id} title={s.title} key={s.id}>
            {ARTBOARDS.filter(a => sectionOf(a) === s.id).map(a => (
              <DCArtboard id={a.id} key={a.id} label={a.label} width={W} height={H}>
                <a.C />
              </DCArtboard>
            ))}
          </DCSection>
        ))}
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakRadio label="Mode" value={t.theme} onChange={v => setTweak("theme", v)}
            options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]} />
        </TweakSection>
        <TweakSection label="Accent">
          <TweakColor label="Color" value={t.accent} onChange={v => setTweak("accent", v)}
            options={["#1F3A8A", "#3B5BA5", "#1F6E62", "#7A3F00", "#5B1F66"]} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function sectionOf(a) {
  if (a.sec === "Status tab") return "status";
  if (a.sec === "Config tab") return "config";
  if (a.sec === "Devices & Ports") return "devices";
  return "logs";
}

function shade(hex, pct) {
  // simple % lightness shift on hex
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
  const adj = (c) => Math.max(0, Math.min(255, Math.round(c + (pct/100) * 255)));
  r = adj(r); g = adj(g); b = adj(b);
  return "#" + [r,g,b].map(x => x.toString(16).padStart(2, "0")).join("");
}
