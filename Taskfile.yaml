version: '3'

vars:
  GOOS: '{{.GOOS | default "windows"}}'
  GOARCH: '{{.GOARCH | default "amd64"}}'
  OUTPUT_DIR: dist
  BINARY_NAME: 'SerialHop{{if eq .GOOS "windows"}}.exe{{end}}'
  RESOURCE_FILE: resource_windows.syso

tasks:
  manifest:
    desc: Generate assets/manifest.xml from template using version from assets/version.json
    sources:
      - assets/manifest.template.xml
      - assets/version.json
      - tools/render-manifest/main.go
    generates:
      - assets/manifest.xml
    cmds:
      - go run ./tools/render-manifest

  resource:
    desc: Compile the .syso resource (icon + UAC manifest + version metadata)
    deps: [manifest]
    cmds:
      - go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          -64
          -o {{.RESOURCE_FILE}}
          -icon=assets/icon.ico
          -manifest=assets/manifest.xml
          assets/version.json

  build:
    desc: Build the binary (override target via `task build GOOS=... GOARCH=...`)
    deps: [resource]
    cmds:
      - go run ./tools/buildcmd -o {{.OUTPUT_DIR}}/{{.BINARY_NAME}} -goos {{.GOOS}} -goarch {{.GOARCH}}

  installer-manifest:
    desc: Generate tools/installer/manifest.xml from template + version.json.
    sources:
      - tools/installer/manifest.template.xml
      - tools/installer/version.json
      - tools/render-installer-manifest/main.go
    generates:
      - tools/installer/manifest.xml
    cmds:
      - go run ./tools/render-installer-manifest

  installer-resource:
    desc: Compile the installer's .syso (icon + UAC manifest + version metadata).
    deps: [installer-manifest]
    cmds:
      - go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          -64
          -o tools/installer/resource_windows.syso
          -icon=assets/icon.ico
          -manifest=tools/installer/manifest.xml
          tools/installer/version.json

  fetch-ffmpeg:
    desc: Download + SHA-256-verify the pinned ffmpeg.exe into tools/installer/payload/. Idempotent; re-uses an existing valid file.
    sources:
      - internal/streamer/ffmpeg_build.go
      - tools/fetch-ffmpeg/main.go
    generates:
      - tools/installer/payload/ffmpeg.exe
    cmds:
      - go run ./tools/fetch-ffmpeg -out tools/installer/payload/ffmpeg.exe

  installer:
    desc: Build the installer (depends on a fresh `task build` plus a fetched ffmpeg.exe payload).
    deps: [build, installer-resource, fetch-ffmpeg]
    cmds:
      - cp dist/SerialHop.exe tools/installer/payload/SerialHop.exe
      - go run ./tools/buildcmd -o dist/SerialHop-Setup.exe -goos windows -goarch amd64 -tags production -extra-ldflags="-H windowsgui" ./tools/installer

  lint:secrets:
    desc: Fail if any slog.* call logs a config secret field (cfg.LabBridge.Pass)
    cmds:
      - go run ./tools/forbidsecretlog/cmd ./...

  test:
    desc: Run all unit tests
    deps: [lint:secrets]
    cmds:
      - go test ./...

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  preview:
    desc: "Run the panel UI in a desktop browser (macOS / Linux). Uses a Wails-runtime shim — no Windows or WebView2 needed."
    dir: internal/panel/frontend
    cmds:
      - npm install
      - npm run preview:mac

  clean:
    desc: Remove build outputs and generated resources.
    cmds:
      - rm -rf {{.OUTPUT_DIR}} {{.RESOURCE_FILE}} assets/manifest.xml tools/installer/manifest.xml tools/installer/resource_windows.syso tools/installer/payload/SerialHop.exe tools/installer/payload/ffmpeg.exe
