name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Semantic Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^.+$

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/panel/frontend/package-lock.json

      - name: install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: install frontend deps
        run: npm ci
        working-directory: internal/panel/frontend

      - name: frontend build (typecheck + bundle)
        run: npm run build
        working-directory: internal/panel/frontend

      - name: frontend tests
        run: npm test
        working-directory: internal/panel/frontend

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: tests (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1

      - name: cross-compile windows binary
        run: |
          wails build -platform windows/amd64 -s -trimpath \
            -ldflags="-X 'github.com/bioexperiment-lab-devices/serialhop/internal/version.Version=ci-pr-${{ github.event.pull_request.number }}'"
          cp build/bin/SerialHop.exe /tmp/SerialHop.exe

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SerialHop-pr-${{ github.event.pull_request.number }}.exe
          path: /tmp/SerialHop.exe
          retention-days: 7
