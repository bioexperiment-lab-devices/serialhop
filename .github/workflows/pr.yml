name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Semantic Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^.+$

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/panel/frontend/package-lock.json

      - name: install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: install frontend deps
        run: npm ci
        working-directory: internal/panel/frontend

      - name: frontend build (typecheck + bundle)
        run: npm run build
        working-directory: internal/panel/frontend

      - name: frontend tests
        run: npm test
        working-directory: internal/panel/frontend

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: tests (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1

      - name: reinstall + rebuild frontend (govulncheck-action wipes the worktree)
        # govulncheck-action@v1 runs `git reset --hard HEAD` which nukes the
        # gitignored dist/ AND node_modules/ produced by the earlier frontend
        # steps. The wails build below uses -s to skip the frontend script,
        # so we have to put dist/ back ourselves before //go:embed
        # all:frontend/dist can find any files. npm install is faster than
        # ci here because package-lock.json hasn't changed.
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm run build
        working-directory: internal/panel/frontend

      - name: cross-compile windows binary
        # -skipbindings: the TS shims are committed under
        # internal/panel/frontend/src/wails/ (see README there); Wails'
        # bindings regen needs a project layout we don't match and isn't
        # required for the resulting binary.
        #
        # -devtools: enables AreDevToolsEnabled=true in the WebView2
        # settings. Without this, F12 / right-click Inspect have no
        # effect AND the WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS env var's
        # --remote-debugging-port flag is silently ignored — the smoke
        # test's CDP capture depends on it.
        run: |
          wails build -platform windows/amd64 -s -skipbindings -devtools -trimpath \
            -ldflags="-X 'github.com/bioexperiment-lab-devices/serialhop/internal/version.Version=ci-pr-${{ github.event.pull_request.number }}'"
          cp build/bin/SerialHop.exe /tmp/SerialHop.exe

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SerialHop-pr-${{ github.event.pull_request.number }}.exe
          path: /tmp/SerialHop.exe
          retention-days: 7

  panel-smoke:
    name: panel smoke (windows)
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build wv2-inspect (CDP capture tool)
        shell: powershell
        run: |
          go build -o wv2-inspect.exe .\tools\wv2-inspect

      - uses: actions/download-artifact@v7
        with:
          name: SerialHop-pr-${{ github.event.pull_request.number }}.exe
          path: dist

      - name: launch panel and capture window
        # Windows PowerShell 5.1 (not pwsh / PS7) — the legacy .NET Framework
        # has System.Drawing in the GAC, which pwsh's .NET 7+ split out.
        shell: powershell
        run: |
          # Tell WebView2 to expose Chrome DevTools Protocol on port 9222.
          # Belt and braces: set both the PowerShell scope and the process
          # scope, then verify before launching. WEBVIEW2_ADDITIONAL_BROWSER_
          # ARGUMENTS is documented to APPEND to whatever AdditionalBrowserArguments
          # the host set, so it should coexist with Wails' --disable-features.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          [Environment]::SetEnvironmentVariable("WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS", "--remote-debugging-port=9222", "Process")
          Write-Host "Process env: WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=$([Environment]::GetEnvironmentVariable('WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS', 'Process'))"

          $exe = Resolve-Path dist/SerialHop.exe
          Write-Host "Launching $exe"

          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
            using System;
            using System.Drawing;
            using System.Drawing.Imaging;
            using System.Runtime.InteropServices;

            public class Win32 {
                [DllImport("user32.dll")]
                public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
                [DllImport("user32.dll")]
                public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint nFlags);
                [DllImport("user32.dll", SetLastError = true)]
                public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);

                [StructLayout(LayoutKind.Sequential)]
                public struct RECT { public int Left, Top, Right, Bottom; }

                public static Bitmap CaptureWindow(IntPtr hwnd) {
                    RECT rect;
                    GetWindowRect(hwnd, out rect);
                    int w = rect.Right - rect.Left;
                    int h = rect.Bottom - rect.Top;
                    if (w <= 0 || h <= 0) return null;
                    Bitmap bmp = new Bitmap(w, h);
                    using (Graphics g = Graphics.FromImage(bmp)) {
                        IntPtr hdc = g.GetHdc();
                        // PW_RENDERFULLCONTENT (0x00000002): asks WebView2-style
                        // chromium widgets to render their content even when
                        // off-screen / hidden. Required to capture our panel.
                        PrintWindow(hwnd, hdc, 0x00000002);
                        g.ReleaseHdc(hdc);
                    }
                    return bmp;
                }
            }
          "@ -ReferencedAssemblies System.Drawing

          # Launch via ProcessStartInfo with UseShellExecute=$false so we
          # can deterministically force the env var into the child process.
          # Use a per-run user-data-dir for WebView2 — without this, WebView2
          # may reuse a global Edge profile and silently bail if it has
          # stale crash state.
          $userData = Join-Path $env:TEMP "wv2-userdata-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Force -Path $userData | Out-Null

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          # Chromium 111+ requires --remote-allow-origins to actually open
          # the debug port (otherwise it's silently filtered for security).
          $psi.EnvironmentVariables["WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS"] = "--remote-debugging-port=9222 --remote-allow-origins=*"
          $psi.EnvironmentVariables["WEBVIEW2_USER_DATA_FOLDER"] = $userData
          $proc = [System.Diagnostics.Process]::Start($psi)
          Write-Host "Started pid=$($proc.Id); waiting 15s for WebView2 to come up"
          Start-Sleep -Seconds 15

          # Use a short, explicit TCP probe (Test-NetConnection's default
          # timeout blocks for ~22s on a closed port).
          $portOpen = $false
          try {
              $tcp = New-Object System.Net.Sockets.TcpClient
              $iar = $tcp.BeginConnect("127.0.0.1", 9222, $null, $null)
              if ($iar.AsyncWaitHandle.WaitOne(2000)) {
                  $tcp.EndConnect($iar)
                  $portOpen = $true
              }
              $tcp.Close()
          } catch {}
          Write-Host "Port 9222 open: $portOpen"
          Write-Host "Process exited: $($proc.HasExited); MainWindowHandle: $($proc.MainWindowHandle)"

          # The diagnostic JS injected by OnDomReady writes runtime state +
          # errors into document.title. Read it via GetWindowText.
          Add-Type @"
            using System;
            using System.Text;
            using System.Runtime.InteropServices;
            public class WinTitle {
                [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
                public static extern int GetWindowTextW(IntPtr hWnd, StringBuilder lpString, int nMaxCount);
            }
          "@
          function Read-Title {
              param([IntPtr]$h)
              if ($h -eq [IntPtr]::Zero) { return "<no window>" }
              $sb = New-Object System.Text.StringBuilder 1024
              [WinTitle]::GetWindowTextW($h, $sb, $sb.Capacity) | Out-Null
              return $sb.ToString()
          }

          # Poll up to 30s for the main window handle (CI runners are sometimes
          # slow to surface it; the diagnostic JS won't fire until OnDomReady,
          # which itself depends on navigation completing).
          for ($i = 0; $i -lt 30; $i++) {
              $proc.Refresh()
              if ($proc.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Seconds 1
          }
          Write-Host "Final HWND after polling: $($proc.MainWindowHandle); HasExited=$($proc.HasExited)"
          if ($proc.MainWindowHandle -ne [IntPtr]::Zero) {
              Write-Host "Title now: $(Read-Title $proc.MainWindowHandle)"
              # Wait extra so the 3s setTimeout in our diagnostic JS fires.
              Start-Sleep -Seconds 5
          }

          # Attach to the WebView2 CDP endpoint and capture console + DOM.
          # Runs for 10s, then writes wv2.json. We do this BEFORE the
          # screenshot so the capture happens against the same state.
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Write-Host "Running wv2-inspect (CDP capture, 10s window)"
          & .\wv2-inspect.exe -port 9222 -duration 10s -out screenshots\wv2.json
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::wv2-inspect exited $LASTEXITCODE (binary may have launched without CDP)"
          }
          Start-Sleep -Seconds 2

          # Refresh process to pick up the main window handle.
          $proc.Refresh()
          $hwnd = $proc.MainWindowHandle
          if ($hwnd -eq [IntPtr]::Zero) {
              Write-Host "::error::Panel never created a main window"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }
          Write-Host "Panel HWND=$hwnd; capturing"

          [Win32]::ShowWindow($hwnd, 9) | Out-Null  # SW_RESTORE
          Start-Sleep -Seconds 1

          $bmp = [Win32]::CaptureWindow($hwnd)
          if ($null -eq $bmp) {
              Write-Host "::error::CaptureWindow returned null"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }

          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          $bmp.Save("screenshots/panel.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "Saved screenshots/panel.png ($($bmp.Width) x $($bmp.Height))"

          # Pixel diversity: a panel that rendered any UI will have many distinct
          # colors. An empty Wails window (no React mount, no assets) shows a
          # uniform background. Sample 500 random points; require at least 12
          # unique ARGB values inside the content area (skipping the OS title
          # bar by clipping the top 32px).
          $rng = New-Object System.Random
          $unique = @{}
          $samples = 500
          $clipTop = [Math]::Min(32, $bmp.Height / 4)
          for ($i = 0; $i -lt $samples; $i++) {
              $x = $rng.Next($bmp.Width)
              $y = $clipTop + $rng.Next($bmp.Height - $clipTop)
              $c = $bmp.GetPixel($x, $y).ToArgb()
              $unique[$c] = $true
          }
          $bmp.Dispose()
          Write-Host "Content area: $($unique.Count) unique colors / $samples samples"

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          if ($unique.Count -lt 12) {
              Write-Host "::error::Panel content area appears empty (only $($unique.Count) unique colors). See uploaded screenshot."
              exit 1
          }

      - name: capture panel logs
        if: always()
        shell: powershell
        run: |
          $logs = Join-Path $env:ProgramData "SerialHop\logs"
          New-Item -ItemType Directory -Force -Path captured-logs | Out-Null
          if (Test-Path $logs) {
              Get-ChildItem $logs | ForEach-Object {
                  Copy-Item $_.FullName -Destination "captured-logs/$($_.Name)"
              }
              Write-Host "Copied $((Get-ChildItem captured-logs).Count) log file(s)"
          } else {
              Write-Host "No log directory at $logs"
          }

      - name: upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-smoke-pr-${{ github.event.pull_request.number }}
          path: |
            screenshots/
            captured-logs/
          retention-days: 14
