name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Semantic Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^.+$

  commit-message:
    # Fail a PR whose squash commit release-please cannot parse. The parser
    # throws on some bodies (e.g. a parenthesis that spans a line break) and
    # release-please then silently skips the commit -> no release PR. Once
    # squash-merged the body can't be fixed (main is protected + linear), so
    # this must run pre-merge. Re-runs on `edited`, so a body fix re-checks.
    # See scripts/check-commit-message.js.
    name: commit message parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: install parser
        run: npm ci
        working-directory: scripts

      - name: verify squash commit parses (release-please guard)
        # title/body via env, never inline ${{ }} in run: — a PR body is
        # attacker-controlled and must not be interpolated into the shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node check-commit-message.js
        working-directory: scripts

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/panel/frontend/package-lock.json

      - name: install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: install frontend deps
        run: npm ci
        working-directory: internal/panel/frontend

      - name: frontend build (typecheck + bundle)
        run: npm run build
        working-directory: internal/panel/frontend

      - name: frontend tests
        run: npm test
        working-directory: internal/panel/frontend

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: tests (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1

      - name: reinstall + rebuild frontend (govulncheck-action wipes the worktree)
        # govulncheck-action@v1 runs `git reset --hard HEAD` which nukes the
        # gitignored dist/ AND node_modules/ produced by the earlier frontend
        # steps. The wails build below uses -s to skip the frontend script,
        # so we have to put dist/ back ourselves before //go:embed
        # all:frontend/dist can find any files. npm install is faster than
        # ci here because package-lock.json hasn't changed.
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm run build
        working-directory: internal/panel/frontend

      - name: cross-compile windows binary
        # -skipbindings: the TS shims are committed under
        # internal/panel/frontend/src/wails/ (see README there); Wails'
        # bindings regen needs a project layout we don't match and isn't
        # required for the resulting binary.
        run: |
          wails build -platform windows/amd64 -s -skipbindings -trimpath \
            -ldflags="-X 'github.com/bioexperiment-lab-devices/serialhop/internal/version.Version=ci-pr-${{ github.event.pull_request.number }}'"
          cp build/bin/SerialHop.exe /tmp/SerialHop.exe

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SerialHop-pr-${{ github.event.pull_request.number }}.exe
          path: /tmp/SerialHop.exe
          retention-days: 7

  ui-checks:
    name: ui-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ui:
              - 'internal/panel/frontend/**'
              - '.github/workflows/pr.yml'

      - name: skip if no UI changes
        if: steps.changes.outputs.ui != 'true'
        run: echo "No UI-relevant paths changed; skipping rendered-UI checks."

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.ui == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/panel/frontend/package-lock.json

      - name: install deps
        if: steps.changes.outputs.ui == 'true'
        run: npm ci
        working-directory: internal/panel/frontend

      - name: install playwright browsers
        if: steps.changes.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: internal/panel/frontend

      - name: build preview bundle
        if: steps.changes.outputs.ui == 'true'
        run: npm run preview:build
        working-directory: internal/panel/frontend

      - name: run playwright
        if: steps.changes.outputs.ui == 'true'
        run: npm run playwright
        working-directory: internal/panel/frontend

      - name: upload playwright report on failure
        if: failure() && steps.changes.outputs.ui == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: internal/panel/frontend/playwright-report
          retention-days: 7
