name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release-build:
    name: release-build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install jq
        run: choco install jq -y
        shell: pwsh

      - name: sync version.json integer fields
        shell: bash
        run: |
          set -euo pipefail
          VER=$(jq -e -r '.StringFileInfo.FileVersion' assets/version.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          jq --argjson major "$MAJOR" --argjson minor "$MINOR" --argjson patch "$PATCH" \
            '.FixedFileInfo.FileVersion.Major = $major |
             .FixedFileInfo.FileVersion.Patch  = $patch |
             .FixedFileInfo.FileVersion.Minor  = $minor |
             .FixedFileInfo.ProductVersion.Major = $major |
             .FixedFileInfo.ProductVersion.Minor = $minor |
             .FixedFileInfo.ProductVersion.Patch  = $patch' \
            assets/version.json > assets/version.json.tmp
          mv assets/version.json.tmp assets/version.json

      - name: build
        run: task build
        shell: bash

      - name: rename and checksum
        shell: pwsh
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          Move-Item dist\SerialHop.exe "dist\SerialHop-$tag.exe"
          Get-FileHash -Algorithm SHA256 dist\*.exe | Format-List | Out-File -Encoding ascii dist\SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/SerialHop-*.exe'

      - name: upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          gh release upload $tag dist/SerialHop-$tag.exe dist/SHA256SUMS.txt --clobber
