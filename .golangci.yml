version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - govet
    - bodyclose
    - misspell
  exclusions:
    paths:
      # Vendored Go code shipped inside npm packages (e.g. the `flatted`
      # package bundles a Go reference implementation under its node_modules
      # tree). Not our code; lint warnings there are noise.
      - internal/panel/frontend/node_modules
